kind = "web"
previewPath = "/"
title = "Senorita"
version = "1.0.0"
id = "artifacts/senorita"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22690
name = "web"
paths = ["/"]

[services.development]
run = "PORT=22690 pnpm --filter @workspace/senorita run dev"

[services.env]
PORT = "22690"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/senorita", "run", "build"]
publicDir = "artifacts/senorita/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
